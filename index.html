<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>縁乃助 出勤確認・掃除進捗</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>縁乃助</h1>
    <nav class="tabs">
      <button data-tab="attendance" class="active">出勤確認</button>
      <button data-tab="cleaning">掃除進捗管理</button>
    </nav>
  </header>

  <main>
    <!-- 出勤確認: スタッフ選択 -->
    <section id="screen-staff-select" class="screen active">
      <h2>スタッフを選んでください</h2>
      <div id="staff-grid" class="grid-buttons"></div>
    </section>

    <!-- 出勤確認: シフト照合・出勤確認 -->
    <section id="screen-shift-confirm" class="screen">
      <div id="shift-confirm-box" class="card"></div>
    </section>

    <!-- 出勤確認: ポジション選択 -->
    <section id="screen-position-select" class="screen">
      <h2>ポジションを選んでください</h2>
      <div id="position-grid" class="grid-buttons"></div>
      <div class="row-actions">
        <button class="secondary" onclick="showScreen('screen-staff-select')">戻る</button>
        <button id="position-next-btn" class="primary">次へ(身だしなみチェック)</button>
      </div>
    </section>

    <!-- 掃除進捗: 担当者選択 -->
    <section id="screen-cleaning-staff-select" class="screen">
      <h2>あなたの名前を選んでください</h2>
      <div id="cleaning-staff-grid" class="grid-buttons"></div>
    </section>

    <!-- 掃除進捗: ポジション選択 -->
    <section id="screen-cleaning-position-select" class="screen">
      <h2>担当ポジションを選んでください</h2>
      <div id="cleaning-position-grid" class="grid-buttons"></div>
      <div class="row-actions">
        <button class="secondary" onclick="showScreen('screen-cleaning-staff-select')">戻る</button>
      </div>
    </section>

    <!-- 掃除進捗: 一覧 -->
    <section id="screen-cleaning-list" class="screen">
      <h2 id="cleaning-list-title"></h2>
      <p class="muted">タップで完了/未完了を切り替えます。</p>
      <div id="cleaning-spot-list" class="grid-buttons" style="display:flex; flex-direction:column; gap:10px;"></div>
      <div class="row-actions">
        <button class="secondary" onclick="showScreen('screen-cleaning-position-select')">ポジションを選び直す</button>
      </div>
    </section>
  </main>
</div>

<!-- 身だしなみチェック モーダル -->
<div id="grooming-modal" class="modal-backdrop">
  <div class="modal">
    <h2>身だしなみチェック</h2>
    <div id="grooming-list"></div>
    <div class="row-actions" style="margin-top:18px;">
      <button id="grooming-cancel-btn" class="secondary">キャンセル</button>
      <button id="grooming-confirm-btn" class="primary" disabled>出勤を確定する</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
